name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install mpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv
      - name: Install mpv (Windows)
        if: runner.os == 'Windows'
        run: choco install mpvio --yes --no-progress
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify playback backend is available
        run: python -c "import shutil; assert shutil.which('mpv'), 'mpv must be on PATH for native IPC tests'"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Test (including native mpv IPC)
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
