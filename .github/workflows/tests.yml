name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install mpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv
      - name: Install mpv (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install mpvio --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Chocolatey updates machine PATH, not the runner's inherited environment.
          $mpvDirectory = Join-Path $env:ChocolateyInstall 'lib\mpvio.install\tools'
          if (-not (Test-Path (Join-Path $mpvDirectory 'mpv.exe'))) {
            throw "mpv executable not found in $mpvDirectory"
          }
          $mpvDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Python dependencies (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install -e '.[dev,linux]'
      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -e '.[dev,windows]'
      - name: Check Windows media-control imports
        if: runner.os == 'Windows'
        run: python -c "import winrt.windows.media; import winrt.windows.media.interop; import winrt.windows.storage.streams"
      - name: Verify playback backend is available
        run: python -c "import shutil; assert shutil.which('mpv'), 'mpv must be on PATH for native IPC tests'"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src docs/generate_previews.py
      - name: Test (including native mpv IPC)
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Report test failures
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path('test-results.xml')
          if report.is_file():
              for case in ElementTree.parse(report).iter('testcase'):
                  for detail in list(case):
                      if detail.tag not in {'failure', 'error'}:
                          continue
                      message = f"{case.get('classname')}.{case.get('name')}: {detail.text or ''}"
                      message = message[:6000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::error::{message}')
      - name: Build distributions
        run: python -m build
