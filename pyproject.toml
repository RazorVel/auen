[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auen"
version = "0.2.0"
description = "A terminal audio player with YouTube search, streaming, and caching"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["audio", "terminal", "textual", "tui", "youtube"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "textual>=8.2,<9",
    "yt-dlp>=2024.0.0",
    "platformdirs>=4.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "textual-dev>=1.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[project.scripts]
auen = "auen.cli:main"

[project.urls]
Homepage = "https://github.com/razorvel/auen"
Issues = "https://github.com/razorvel/auen/issues"
Source = "https://github.com/razorvel/auen"

[tool.hatch.build.targets.sdist]
exclude = ["/audio-engine"]

[tool.ruff]
target-version = "py310"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["auen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 15
timeout_method = "thread"
